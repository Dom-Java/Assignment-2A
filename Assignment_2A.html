<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agriculture Watch</title>
    <link rel="stylesheet" href="Assignment_2A.css" />
  </head>
  <nav class="nav">
    <a href="#">
      <span><img src="" alt="" /></span>
    </a>
    <a href="#" class="btn">About us</a>
    <a href="#" class="btn">login</a>
  </nav>
  <body class="page-bg">
    <main class="main">
      <aside class="forms-side">
        <header>
          <h2 class="site-text">Telemetry Data:</h2>
        </header>
        <div>
          <form
            class="health-form"
            id="tele_form"
            action="Assignment_2A.html"
            method="post"
            onsubmit="return false;"
          >
            <label class="form-element" for="tele_form" id="bay_num"
              >Bay Number</label
            >
            <input type="text" />

            <label class="form-element" for="tele_form" pH_num>pH level</label>
            <input type="number" />

            <label class="form-element" for="tele_form" id="temp_num"
              >Temperature</label
            >
            <input type="number" />

            <label class="form-element" for="tele_form" id="ec_num"
              >Electrical conductivity</label
            >
            <input type="number" />

            <label class="form-element" for="tele_form" id="hum_num"
              >Relative Humidity</label
            >
            <input type="number" />

            <div class="form-element">
              <button class="btn" for="tele_form" type="button" id="submit_btn">
                Submit Form
              </button>
            </div>
          </form>
        </div>
        <!-- This will be used for the user to fill out their info -->
      </aside>

      <section class="dashboard-side">
        <header>
          <h2 class="site-text">Agricultural Health Dashboard:</h2>
          <div>
            <output name="y" id="y" form="tele_form" for="bay_num"> </output>
            <output for="pH_num"> </output>
            <output for="ec_num"> </output>
            <output for="temp_num"> </output>
            <output for="submit_btn"> </output>
          </div>
        </header>
        <!-- This will display the users dashboard -->
      </section>
    </main>
  </body>
  <script>
    //will be used for the js imported into the project
  </script>
  <footer class="footer">
    <p>&copy; Agriculture Watch</p>
  </footer>
</html>

● Story 2 (Status Feedback): As an agronomist, I want the portal to calculate and display an environmental status tag ("Optimal", "Warning", "Critical Hazard") immediately upon input submission.
● Story 3 (Offline Session Persistence): As a field worker moving between greenhouses, I want logged sensor entries saved to localStorage so that refreshing the browser retains active log history.
● Story 4 (Log Removal & Queue Purging): As an operations supervisor, I want to delete resolved logs individually or purge the entire log history.
