<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agriculture Watch</title>
    <link rel="stylesheet" href="Assignment_2A.css" />
  </head>
  <nav class="nav">
  
      <a href="" class="logo-container">
        <img class="logo" src="logo.png" alt="" />
      </a>
    </span>

    <h1 class="nav-item site-heading site-text">Agriculture Watch</h1>

    <a href="#" class="btn nav-item">About us</a>
    <a href="#" class="btn nav-item">login</a>
  </nav>
  <body class="page-bg">
    <main class="main">
      <aside class="forms-side">
        <header>
          <h2 class="site-text">Telemetry Data:</h2>
        </header>
        <div>
          <form
            class="health-form"
            id="tele_form"
            action="Assignment_2A.html"
            method="post"
          >
            <label class="form-element" for="tele_form" 
              >Bay Number</label
            >
            <input type="number" class="form-input-bg" id="bay_num" name="bay_num"/>

            <label class="form-element" for="tele_form">pH level</label>
            <input type="number" class="form-input-bg" id="pH_num" name="pH_num"/>

            <label class="form-element" for="tele_form"
              >Temperature</label
            >
            <input type="number" class="form-input-bg" id="temp_num" name="temp_num"/>

            <label class="form-element" for="tele_form" 
              >Electrical conductivity</label
            >
            <input type="number" class="form-input-bg" id="ec_num" name="ec_num"/>

            <label class="form-element" for="tele_form" 
              >Relative Humidity</label
            >
            <input type="number" class="form-input-bg" id="hum_num" name="hum_num"/>

            <output name="outcome" for="bay_num pH_num temp_num ec_num hum_num"> 0 </output>
            <div class="form-element">
              <button class="btn" for="tele_form" type="submit" id="submit_btn">
                Submit Form
              </button>
            </div>
          </form>
        </div>
        <!-- This will be used for the user to fill out their info -->
      </aside>

      <section class="dashboard-side">
        <header>
          <h2 class="site-text">Agricultural Health Dashboard:</h2>
          <div>
            <p id="bay-num-out"></p>
            <p id="pH-num-out"></p>
            <p id="temp-num-out"></p>
            <p id="ec-num-out"></p>
            <p id="humidity-num-out"></p>
            <!-- <output name="y" id="y" form="tele_form" for="bay_num"> 0 </output>
            <output for="pH_num" form="tele_form" > 0 </output>
            <output for="ec_num" form="tele_form" > 0</output>
            <output for="temp_num" form="tele_form" > 0</output>
            <output for="submit_btn" form="tele_form" > 0 </output> -->
          </div>
        </header>
        <!-- This will display the users dashboard -->
      </section>
    </main>
  </body>
  <script src="Assignment_2A.js"></script>
  <footer class="footer">
    <p class="site-text">&copy; Agriculture Watch</p>
  </footer>
</html>

<!-- notes for use cases: -->

● Story 2 (Status Feedback): As an agronomist, I want the portal to calculate and display an environmental status tag ("Optimal", "Warning", "Critical Hazard") immediately upon input submission.
● Story 3 (Offline Session Persistence): As a field worker moving between greenhouses, I want logged sensor entries saved to localStorage so that refreshing the browser retains active log history.
● Story 4 (Log Removal & Queue Purging): As an operations supervisor, I want to delete resolved logs individually or purge the entire log history.
● Story 5 (Dynamic Out-of-Bound Indicators): As a technician typing values into the form, I want input fields to show instant visual error feedback whenever entered numbers exceed acceptable plant growth ranges.
